<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Free Image Compressor Online</title>
  <meta name="description" content="Compress JPG, PNG and WebP images online for free. Fast, private and easy to use.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #2563eb;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      font-size: 16px;
      opacity: 0.95;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .upload-area {
      border: 2px dashed #2563eb;
      border-radius: 15px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      background: #f8fbff;
    }

    .upload-area:hover {
      background: #eef5ff;
    }

    .upload-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .upload-area h2 {
      margin: 5px 0;
      font-size: 22px;
    }

    .upload-area p {
      color: #667085;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .button {
      display: inline-block;
      border: none;
      border-radius: 10px;
      padding: 13px 22px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .settings {
      margin-top: 25px;
    }

    .settings label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
    }

    #qualityValue {
      font-weight: bold;
      color: #2563eb;
    }

    .preview {
      display: none;
      margin-top: 25px;
    }

    .preview img {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      background: #eee;
    }

    .stats {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f1f5f9;
    }

    .stats div {
      margin: 7px 0;
    }

    .success {
      color: #15803d;
      font-weight: bold;
    }

    #downloadBtn {
      display: none;
      width: 100%;
      margin-top: 20px;
    }

    .privacy {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #667085;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #667085;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 27px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🖼️ Free Image Compressor</h1>
  <p>Reduce image file size quickly and easily.</p>
</header>

<div class="container">

  <div class="card">

    <label for="imageInput" class="upload-area">
      <div class="upload-icon">📷</div>

      <h2>Choose an Image</h2>

      <p>JPG, PNG or WebP</p>

      <span class="button">Select Image</span>
    </label>

    <input
      type="file"
      id="imageInput"
      accept="image/jpeg,image/png,image/webp"
    >

    <div class="settings">

      <label>
        Compression Quality:
        <span id="qualityValue">70%</span>
      </label>

      <input
        type="range"
        id="quality"
        min="10"
        max="100"
        value="70"
      >

    </div>

    <div class="preview" id="preview">

      <h3>Preview</h3>

      <img id="previewImage" alt="Image preview">

      <div class="stats">

        <div>
          Original size:
          <strong id="originalSize">-</strong>
        </div>

        <div>
          Compressed size:
          <strong id="compressedSize">-</strong>
        </div>

        <div>
          Saved:
          <strong class="success" id="saved">-</strong>
        </div>

      </div>

      <button
        class="button"
        id="downloadBtn"
      >
        ⬇️ Download Compressed Image
      </button>

    </div>

    <div class="privacy">
      🔒 Your image is processed directly in your browser.
      It is not uploaded to a server.
    </div>

  </div>

</div>

<footer>
  © 2026 Free Image Compressor
</footer>

<script>

const imageInput = document.getElementById("imageInput");
const quality = document.getElementById("quality");
const qualityValue = document.getElementById("qualityValue");

const preview = document.getElementById("preview");
const previewImage = document.getElementById("previewImage");

const originalSize = document.getElementById("originalSize");
const compressedSize = document.getElementById("compressedSize");
const saved = document.getElementById("saved");

const downloadBtn = document.getElementById("downloadBtn");

let compressedBlob = null;
let originalFileName = "compressed-image.jpg";

quality.addEventListener("input", function() {
  qualityValue.textContent = quality.value + "%";

  if (imageInput.files.length > 0) {
    compressImage(imageInput.files[0]);
  }
});

imageInput.addEventListener("change", function() {

  const file = imageInput.files[0];

  if (!file) {
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Please select an image file.");
    return;
  }

  originalFileName = file.name;

  compressImage(file);
});

function compressImage(file) {

  const reader = new FileReader();

  reader.onload = function(event) {

    const img = new Image();

    img.onload = function() {

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      let width = img.width;
      let height = img.height;

      /*
        Keep large images from becoming unnecessarily huge.
        Maximum dimension: 2500 pixels.
      */

      const maxDimension = 2500;

      if (width > maxDimension || height > maxDimension) {

        if (width > height) {

          height = Math.round(
            height * maxDimension / width
          );

          width = maxDimension;

        } else {

          width = Math.round(
            width * maxDimension / height
          );

          height = maxDimension;
        }
      }

      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      const qualityValueNumber =
        parseInt(quality.value) / 100;

      canvas.toBlob(
        function(blob) {

          if (!blob) {
            alert("Compression failed. Please try another image.");
            return;
          }

          compressedBlob = blob;

          const compressedURL =
            URL.createObjectURL(blob);

          previewImage.src = compressedURL;

          preview.style.display = "block";

          originalSize.textContent =
            formatBytes(file.size);

          compressedSize.textContent =
            formatBytes(blob.size);

          let percentage =
            ((file.size - blob.size) / file.size) * 100;

          if (percentage < 0) {
            percentage = 0;
          }

          saved.textContent =
            percentage.toFixed(1) + "%";

          downloadBtn.style.display = "block";

        },
        "image/jpeg",
        qualityValueNumber
      );

    };

    img.src = event.target.result;

  };

  reader.readAsDataURL(file);
}

downloadBtn.addEventListener("click", function() {

  if (!compressedBlob) {
    return;
  }

  const url =
    URL.createObjectURL(compressedBlob);

  const link =
    document.createElement("a");

  link.href = url;

  const cleanName =
    originalFileName
      .replace(/\.[^/.]+$/, "");

  link.download =
    cleanName + "-compressed.jpg";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

  setTimeout(function() {
    URL.revokeObjectURL(url);
  }, 1000);

});

function formatBytes(bytes) {

  if (bytes === 0) {
    return "0 Bytes";
  }

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const i =
    Math.floor(
      Math.log(bytes) / Math.log(1024)
    );

  return (
    parseFloat(
      (bytes / Math.pow(1024, i)).toFixed(2)
    ) +
    " " +
    units[i]
  );
}

</script>

</body>
  </html>
